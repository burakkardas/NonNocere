<!DOCTYPE html>
<html lang="en" data-page="stage">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video — Nonnocere</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient">
      <canvas id="ambient-canvas" class="ambient__canvas" aria-hidden="true"></canvas>
      <div class="ambient__grid" aria-hidden="true"></div>
      <div class="ambient__vignette" aria-hidden="true"></div>
    </div>

    <header class="app-header">
      <a href="index.html" class="app-logo" aria-label="Nonnocere">
        <img src="assets/Logo.png" alt="Nonnocere" />
      </a>

      <nav class="lang-switcher" aria-label="Language">
        <button class="lang-pill" data-locale="en" type="button">EN</button>
        <button class="lang-pill" data-locale="tr" type="button">TR</button>
        <button class="lang-pill" data-locale="de" type="button">DE</button>
      </nav>
    </header>

    <main class="stage">
      <a href="index.html" class="back-button">
        <svg class="back-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5" />
          <path d="m11 19-7-7 7-7" />
        </svg>
        <span data-i18n="back">BACK</span>
      </a>

      <div class="stage__head">
        <span class="stage__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M10 8.5 16 12l-6 3.5z" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <div class="stage__heading">
          <span class="stage__index">02</span>
          <h1 class="stage__title" data-i18n="menuVideo">Video</h1>
        </div>
      </div>

      <p class="stage__description" data-i18n="menuVideoHint">Cinematic storytelling</p>

      <div class="gallery" data-gallery="videos" aria-live="polite"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>

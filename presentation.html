<!DOCTYPE html>
<html lang="en" data-page="stage">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentation — Nonnocere</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient">
      <canvas id="ambient-canvas" class="ambient__canvas" aria-hidden="true"></canvas>
      <div class="ambient__grid" aria-hidden="true"></div>
      <div class="ambient__vignette" aria-hidden="true"></div>
    </div>

    <header class="app-header">
      <a href="index.html" class="app-logo" aria-label="Nonnocere">
        <img src="assets/Logo.png" alt="Nonnocere" />
      </a>

      <nav class="lang-switcher" aria-label="Language">
        <button class="lang-pill" data-locale="en" type="button">EN</button>
        <button class="lang-pill" data-locale="tr" type="button">TR</button>
        <button class="lang-pill" data-locale="de" type="button">DE</button>
      </nav>
    </header>

    <main class="stage">
      <a href="index.html" class="back-button">
        <svg class="back-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5" />
          <path d="m11 19-7-7 7-7" />
        </svg>
        <span data-i18n="back">BACK</span>
      </a>

      <div class="stage__head">
        <span class="stage__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="4" height="12" rx="1.2" />
            <rect x="9" y="4" width="6" height="16" rx="1.4" />
            <rect x="17" y="6" width="4" height="12" rx="1.2" />
          </svg>
        </span>
        <div class="stage__heading">
          <span class="stage__index">01</span>
          <h1 class="stage__title" data-i18n="menuPresentation">Presentation</h1>
        </div>
      </div>

      <p class="stage__description" data-i18n="menuPresentationHint">Curated visual narrative</p>

      <section class="slideshow" data-slideshow="presentations" aria-roledescription="carousel" aria-live="polite">
        <div class="slideshow__viewport" id="slideshow-viewport">
          <!-- Slides injected here -->
        </div>

        <button
          type="button"
          class="slideshow__nav slideshow__nav--prev"
          id="slideshow-prev"
          aria-label="Previous slide"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>

        <button
          type="button"
          class="slideshow__nav slideshow__nav--next"
          id="slideshow-next"
          aria-label="Next slide"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 6 6 6-6 6" />
          </svg>
        </button>

        <button
          type="button"
          class="slideshow__fullscreen"
          id="slideshow-fullscreen"
          aria-label="Toggle fullscreen"
        >
          <svg class="slideshow__fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9V4h5" />
            <path d="M20 9V4h-5" />
            <path d="M4 15v5h5" />
            <path d="M20 15v5h-5" />
          </svg>
          <svg class="slideshow__fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4v5H4" />
            <path d="M15 4v5h5" />
            <path d="M9 20v-5H4" />
            <path d="M15 20v-5h5" />
          </svg>
        </button>

        <footer class="slideshow__footer">
          <span class="slideshow__counter">
            <span id="slideshow-current">1</span>
            <span class="slideshow__counter-sep">/</span>
            <span id="slideshow-total">1</span>
          </span>
          <div class="slideshow__dots" id="slideshow-dots" role="tablist"></div>
          <span class="slideshow__title" id="slideshow-title"></span>
        </footer>

        <div class="slideshow__empty" id="slideshow-empty" hidden></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
